# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Update: pre-commit autoupdate
#
# Hook set follows the dryvist python template (precommit/templates/python.yaml).
# Repo-local additions kept on top of it: extra general hygiene hooks, bandit and
# detect-secrets. CI runs this same file via `_python-ci` (`pre-commit run --all-files`).

default_language_version:
  python: python3.12

repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']  # Allow custom tags
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: name-tests-test
        args: ['--pytest-test-first']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/.*\.ya?ml$
        args:
          - --persona=regular
          - --min-severity=medium
          - --min-confidence=medium
          - --config
          - zizmor.yml

  # Ruff - Fast all-in-one Python linter and formatter
  # Replaces: flake8, isort, pylint, pyupgrade, black, and many more
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format

  # pyright + pytest run from the project venv (uv sync --extra dev), so the
  # pyproject.toml dev dependencies are the single version authority.
  # pytest runs at pre-push only; CI runs the full suite.
  - repo: local
    hooks:
      - id: pyright
        name: pyright (type check, from .venv)
        entry: .venv/bin/pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (from .venv, pre-push only)
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Bandit - Security linter (Ruff has S rules but Bandit is more comprehensive)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-r', 'src/']
        additional_dependencies: ['bandit[toml]']

  # Check for common security issues in Python code
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'package\.lock\.json|\.lock\.yml$|\.github/aw/'

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
